# بناء ملف APK تلقائياً عند كل رفع للمشروع، أو يدوياً من تبويب Actions ← Build APK ← Run workflow
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # التوقيع بمفتاحك الخاص (اختياري): أضف الأسرار في Settings ← Secrets and variables ← Actions
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rawayie.jks"
            echo "RAWAYIE_KEYSTORE=$RUNNER_TEMP/rawayie.jks" >> "$GITHUB_ENV"
          else
            echo "لا يوجد مفتاح خاص: سيُوقَّع الملف بمفتاح التجربة"
          fi

      - name: Build
        env:
          RAWAYIE_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          RAWAYIE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAWAYIE_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: rawayie-azan-apk
          path: app/build/outputs/apk/release/*.apk
