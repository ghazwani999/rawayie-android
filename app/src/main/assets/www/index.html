<style>
/* شاشة المسجد: مسرح ثابت المقاس (1080×1920 رأسي أو 1920×1080 أفقي) يُكبَّر ليملأ الشاشة؛ لوحة إعدادات داكنة مستقلة */
:root{--ink:#000;--sbg:#0B1528;--scard:#122039;--sline:#22365A;--stext:#EEF2F8;--smuted:#9AAAC2;--sacc:#E7B65B;--sdanger:#E5636B;--son:#2E7FD0;
color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
@font-face{font-family:"Cairo";src:url(fonts/Cairo-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Cairo";src:url(fonts/Cairo-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Tajawal";src:url(fonts/Tajawal-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Tajawal";src:url(fonts/Tajawal-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Noto Sans Arabic";src:url(fonts/NotoSansArabic-Bold.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Noto Naskh Arabic";src:url(fonts/NotoNaskhArabic-Bold.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Amiri";src:url(fonts/AmiriBold.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Scheherazade New";src:url(fonts/ScheherazadeNew-Bold.ttf) format("truetype");font-display:swap}
@font-face{font-family:"UthmanicHafs";src:url(fonts/UthmanicHafs_V22.ttf) format("truetype");font-display:swap;unicode-range:U+0000-060B,U+060D-10FFFF}
@font-face{font-family:"UthmanTaha";src:url(fonts/KFGQPCUthmanTaha.ttf) format("truetype");font-display:swap;unicode-range:U+0000-060B,U+060D-10FFFF}
@font-face{font-family:"MadinahHafs";src:url(fonts/uthmanic_hafs_v20.ttf) format("truetype");font-display:swap;unicode-range:U+0000-060B,U+060D-10FFFF}
@font-face{font-family:"UthmanTN";src:url(fonts/UthmanTNB_v2-0.ttf) format("truetype");font-display:swap;unicode-range:U+0000-060B,U+060D-10FFFF}
@font-face{font-family:"Othmani";src:url(fonts/Othmani-Regular.ttf) format("truetype");font-display:swap;unicode-range:U+0000-060B,U+060D-10FFFF}
@font-face{font-family:"Sultan";src:url(fonts/SFSultan-Black.ttf) format("truetype");font-display:swap}
@font-face{font-family:"BaradaReqa";src:url(fonts/BaradaReqa.ttf) format("truetype");font-display:swap}
@font-face{font-family:"MohammadArt";src:url(fonts/mohammadboldart1.ttf) format("truetype");font-display:swap}
@font-face{font-family:"KSA";src:url(fonts/KSARegular.ttf) format("truetype");font-display:swap;unicode-range:U+0000-060B,U+060D-10FFFF}
@font-face{font-family:"Foda";src:url(fonts/FodaFreeFont.ttf) format("truetype");font-display:swap}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden}
body{font-family:"Cairo",Tahoma,sans-serif;color:#fff}

/* ===== المسرح ===== */
#stage{position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;background:#0a1630 center/cover no-repeat;
  --fg:#fff;--fg2:rgba(255,255,255,.78);--panel:rgba(0,0,0,.34);--line:rgba(255,255,255,.16);--acc:#E7B65B;--accraw:#E7B65B;--hi:rgba(255,255,255,.22);--hifg:#fff;
  --ft:"Cairo",sans-serif;--fn:"Cairo",sans-serif;--fz:"UthmanicHafs","Amiri",serif;color:var(--fg);font-family:var(--ft);font-weight:700;user-select:none}
.main{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.tm,.ss,.cv,.c2,.c3,.gre,.a,.i,.o-clock,.o-cnt{font-family:var(--fn)}
.dg{display:inline-block;width:.56em;text-align:center}
.dc{display:inline-block;width:.3em;text-align:center}
.mname{text-align:center;color:var(--namefg,var(--acc));line-height:1.3;min-width:0;max-width:100%;overflow:hidden;padding:0 64px}
.dayn,.hij{max-width:100%;overflow:hidden;flex:none}
.dayn,.hij{text-align:center;color:var(--acc);line-height:1.35}
.hij{transition:opacity .45s ease,transform .45s ease;cursor:pointer}
.hij.dout{opacity:0;transform:translateY(-12px)}
.dalt .wcol .gre{display:none}
@media (prefers-reduced-motion:reduce){.hij{transition:none}}
.mid{display:flex;align-items:center;justify-content:space-between;flex:none}
.ms{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cv{color:var(--acc);direction:ltr;line-height:1;white-space:nowrap;transform-origin:center}
.cl{color:var(--fg)}
.wx{display:flex;align-items:center;gap:14px;color:var(--acc);direction:ltr;line-height:1}
.wx img{object-fit:contain}
.gre{color:var(--acc);direction:ltr}
.emb{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:radial-gradient(circle,rgba(255,255,255,.16) 0,rgba(255,255,255,.06) 58%,rgba(255,255,255,0) 71%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.elogo{height:76%;object-fit:contain;opacity:var(--logoop,1);filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.elogo[src$="img/mark.png"]{height:auto;width:88%}
.center{position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.cpan{display:flex;flex-direction:column;align-items:center}
.clk{display:flex;direction:ltr;align-items:center;gap:26px}
.tm{color:var(--fg);line-height:1}
.sx{display:flex;flex-direction:column;align-items:center;gap:4px}
.ss{color:var(--fg);line-height:1}
.ap{color:var(--fg);font-style:normal}
.red{color:#ff5a5a!important}
.zone{position:relative;display:flex;flex-direction:column;flex:none}
.L .zone{flex:1;justify-content:center}
.zone.sliding>*:not(.slide){visibility:hidden}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow:hidden;text-shadow:none;z-index:2}
.slide.full{z-index:4}
.sbox{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.sbox .st,.sbox .sb{white-space:pre-line;max-width:100%;overflow-wrap:anywhere}
.sbox .st{text-wrap:balance}
.news{position:relative;overflow:hidden;flex:none;color:var(--fg);background:var(--newsbg,var(--rowbg,rgba(0,0,0,.25)));border-radius:16px}
.nonewsbg .news{text-shadow:0 2px 8px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)}
.lightbg .main{text-shadow:0 1px 2px rgba(255,255,255,.45)}
.tick{position:absolute;top:50%;white-space:nowrap}
.tick.mq{left:0;animation:mq 30s linear infinite;will-change:transform;transform:translate(var(--from,0),-50%)}
.tick.mq b{color:var(--acc);margin:0 30px}
@keyframes mq{from{transform:translate(var(--from,0),-50%)}to{transform:translate(var(--to,0),-50%)}}
.tick.st{left:0;right:0;text-align:center;transform:translateY(-50%);overflow:hidden;text-overflow:ellipsis}
.fade{animation:fd .8s ease both}
@keyframes fd{from{opacity:0}to{opacity:1}}
.rows{display:flex;flex-direction:column;min-height:0}
.thead{display:flex;align-items:center;flex:none;color:var(--fg2);font-family:var(--ft);opacity:.9}
.thead .c1,.thead .c3{color:var(--fg2)}.thead .c2{color:var(--fg2);direction:rtl}
.thead{background:none;border:0;box-shadow:none}
.thead>div{white-space:nowrap;line-height:1.2;color:var(--acc)!important;text-align:center}
.thead .c1{text-align:start}.ctr .thead .c1{text-align:center}
.P .thead{padding:0 24px;margin-top:22px;height:52px}.L .thead{padding:0 28px;height:48px}
.P .thead>div{font-size:calc(36px*var(--s-pname,1)*var(--ts,1))}.L .thead>div{font-size:calc(32px*var(--s-pname,1)*var(--ts,1))}
.P .thead+.rows{margin-top:6px}
.L .thead+.rows{margin-top:4px}
.wx-top,.wx-bottom{position:absolute;right:34px;z-index:3}
.wx-top{top:28px}.wx-bottom{bottom:24px}
.clk .wx{align-self:flex-start;margin-top:30px}
.P .fullclk .tm{font-size:calc(205px*var(--s-clock,1)*var(--ns,1))}.L .fullclk .tm{font-size:calc(175px*var(--s-clock,1)*var(--ns,1))}
.P .wx-top,.P .wx-bottom{font-size:56px}.P .wx-top img,.P .wx-bottom img{width:56px;height:56px}
.L .wx-top,.L .wx-bottom{font-size:48px}.L .wx-top img,.L .wx-bottom img{width:48px;height:48px}
.row{flex:1;min-height:0;display:flex;align-items:center;border-radius:26px;line-height:1.15;transition:background .4s,opacity .4s}
.row[data-k="fajr"],.card[data-k="fajr"]{cursor:pointer}
.c1{width:38%;text-align:start;color:var(--acc)}
.c2{width:36%;text-align:center;color:var(--fg);direction:ltr}
.c3{width:26%;text-align:center;color:var(--acc);direction:ltr}
.home .c1,.home .c2{width:50%}
.ctr .c1{text-align:center}
.shadow .rows{gap:var(--rowgap,10px)}
.shadow .row,.shadow .card{background:var(--rowbg);box-shadow:var(--rowsh)}
.row{border-radius:var(--rowrad,26px)}
.row.hi,.shadow .row.hi{background:var(--hi)}
.lightbg .row.hi .c1,.lightbg .row.hi .c2,.lightbg .row.hi .c3{color:#fff;text-shadow:none}
.hitxt .row.hi .c1,.hitxt .row.hi .c2,.hitxt .row.hi .c3{color:var(--hifg);text-shadow:none}
.hiframe .row.hi{background:transparent;box-shadow:inset 0 0 0 5px var(--hiline)}.hiframe.shadow .row.hi{background:var(--rowbg);box-shadow:inset 0 0 0 5px var(--hiline),var(--rowsh)}
.hiprev{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;padding:14px 18px;border-radius:14px;background-size:cover;background-position:center;font-weight:700;font-size:18px}
.hiprev i{font-style:normal;direction:ltr}
.wmon .rows{position:relative;isolation:isolate}
.wmon .rows::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--wmimg,url(img/mark.png)) center/auto var(--wmh,85%) no-repeat;opacity:var(--wmop,.12)}
.lightbg.wmon .rows::before{filter:brightness(.35)}
.row.past,.card.past{opacity:.45}
.row.eid .c1{color:var(--fg)}
.fixed{text-align:center;color:var(--acc);font-family:var(--fz);font-weight:700;line-height:1.5;flex:none}
.foot{text-align:center;color:var(--fg2);font-family:"Cairo",sans-serif;font-weight:400;text-shadow:none;flex:none}
.foot,.o-ver{direction:ltr;unicode-bidi:isolate}
.fsite{font-weight:600;letter-spacing:.02em;unicode-bidi:isolate}.floc{font-weight:600}.fsep{margin:0 .7em;font-weight:400}
.net{color:#5fd38d}.net.off{color:#ff5a5a}.warn{color:var(--acc)}
.flag{position:absolute;bottom:26px;left:30px;width:62px;height:62px;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.hdr{display:flex;align-items:center;justify-content:center;gap:24px}
.hdr .logo{height:110px;object-fit:contain;opacity:var(--logoop,1)}
.lgw.sq{aspect-ratio:1/1}
.lgw{aspect-ratio:1024/916;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.hdr .logo.lgw{width:auto}
.lgw.silver .lgm{opacity:.96}
.logolt .emb{background:radial-gradient(circle,rgba(0,0,0,.24) 0,rgba(0,0,0,.12) 58%,rgba(0,0,0,0) 71%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.logodk .emb{background:radial-gradient(circle,rgba(255,255,255,.34) 0,rgba(255,255,255,.14) 58%,rgba(255,255,255,0) 71%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.07)}
.logodk .lgw{filter:drop-shadow(0 0 5px rgba(255,255,255,.45))}
.logodk .elogo[src$="img/mark.png"],.logodk .logo[src$="img/mark.png"]{filter:brightness(.28) drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.lgm{width:100%;height:100%;background:var(--logog);-webkit-mask:var(--logom) center/contain no-repeat;mask:var(--logom) center/contain no-repeat}
#menu{position:absolute;top:26px;left:26px;z-index:6;width:64px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:none;border:0;cursor:pointer;opacity:.7}
#menu span{display:block;width:46px;height:5px;margin:0 auto;border-radius:3px;background:var(--menufg,var(--fg));flex:none}#menu span+span{margin-top:9px}
#menu:focus-visible{outline:3px solid var(--acc)}
.ovon #menu{opacity:.25}
#ov.black~#menu{opacity:.08}

/* رأسي */
.P .main{padding:30px 70px 24px}
.P .mname{font-size:calc(58px*var(--s-name,1)*var(--ts,1))}
.P .dayn{font-size:calc(56px*var(--s-date,1)*var(--ts,1));margin-top:40px}
.P.arch .dayn{margin-top:140px}
.P .hij{font-size:calc(60px*var(--s-date,1)*var(--ts,1))}
.P .mid{height:310px;margin-top:26px}
.P .emb{width:calc(300px*var(--emb,.7));height:calc(300px*var(--emb,.7));margin:0 10px}
.P .cv{font-size:calc(100px*var(--s-count,1)*var(--ns,1))}.P .cl{font-size:calc(42px*var(--s-count,1)*var(--ts,1))}
.P .bigcnt .cv{font-size:calc(128px*var(--s-count,1)*var(--ns,1))}
.P .wx{font-size:84px}.P .wx img{width:84px;height:84px}.P .gre{font-size:calc(54px*var(--s-date,1)*var(--ns,1))}
.P .center{height:330px}
.P .tm{font-size:calc(270px*var(--s-clock,1)*var(--ns,1))}.P .ss{font-size:calc(110px*var(--s-clock,1)*var(--ns,1))}.P .ap{font-size:calc(46px*var(--s-clock,1)*var(--ts,1))}
.P .bigcnt .tm{font-size:calc(230px*var(--s-clock,1)*var(--ns,1))}
.P .news{height:78px;font-size:calc(46px*var(--s-news,1)*var(--ts,1));margin-top:12px}
.P .rows{flex:1;margin-top:20px}
.P .row{padding:0 24px}
.P .c1{font-size:calc(86px*var(--s-pname,1)*var(--ts,1))}.P .c2{font-size:calc(90px*var(--s-ptime,1)*var(--ns,1))}.P .c3{font-size:calc(84px*var(--s-ptime,1)*var(--ns,1))}
.P .fixed{font-size:calc(46px*var(--s-fixed,1)*var(--ts,1));margin-top:12px}
.P .foot{font-size:20px;margin-top:8px}

/* أفقي */
.L .main{padding:24px 64px 18px}
.L .mname{font-size:calc(54px*var(--s-name,1)*var(--ts,1))}
.L .lcols{flex:1;display:flex;gap:56px;min-height:0;margin-top:6px}
.L .lc1{width:47%;display:flex;flex-direction:column;justify-content:center}
.L .lc2{flex:1;display:flex;flex-direction:column;min-height:0}
.L .dayn{font-size:calc(48px*var(--s-date,1)*var(--ts,1))}.L .hij{font-size:calc(50px*var(--s-date,1)*var(--ts,1))}
.L .mid{height:230px;margin-top:8px}
.L .emb{width:calc(220px*var(--emb,.7));height:calc(220px*var(--emb,.7));margin:0 8px}
.L .cv{font-size:calc(76px*var(--s-count,1)*var(--ns,1))}.L .cl{font-size:calc(32px*var(--s-count,1)*var(--ts,1))}
.L .bigcnt .cv{font-size:calc(96px*var(--s-count,1)*var(--ns,1))}
.L .wx{font-size:64px}.L .wx img{width:64px;height:64px}.L .gre{font-size:calc(42px*var(--s-date,1)*var(--ns,1))}
.L .center{height:250px}
.L .tm{font-size:calc(230px*var(--s-clock,1)*var(--ns,1))}.L .ss{font-size:calc(88px*var(--s-clock,1)*var(--ns,1))}.L .ap{font-size:calc(38px*var(--s-clock,1)*var(--ts,1))}
.L .news{height:62px;font-size:calc(38px*var(--s-news,1)*var(--ts,1));margin-top:8px}
.L .rows{flex:1}
.L .row{padding:0 28px}
.L .c1{font-size:calc(80px*var(--s-pname,1)*var(--ts,1))}.L .c2{font-size:calc(82px*var(--s-ptime,1)*var(--ns,1))}.L .c3{font-size:calc(74px*var(--s-ptime,1)*var(--ns,1))}
.L .bigl .c2{font-size:calc(96px*var(--s-ptime,1)*var(--ns,1))}.L .bigl .c3{font-size:calc(86px*var(--s-ptime,1)*var(--ns,1))}
.L .fixed{font-size:calc(40px*var(--s-fixed,1)*var(--ts,1));margin-top:6px}
.L .foot{font-size:18px;margin-top:6px}

/* لوحات العرض */
.board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;min-height:0;padding:20px}
.board .bt{line-height:1.25;text-wrap:balance}
.board .bb{line-height:1.6;white-space:pre-line;font-weight:400;max-width:92%}
.board .bimg{max-width:90%;max-height:46%;object-fit:contain;border-radius:22px}
.bstrip{display:flex;flex-direction:column;gap:14px;flex:none}
.bclk{display:flex;align-items:center;justify-content:space-between;gap:20px}
.bclk .tm{font-size:calc(90px*var(--s-clock,1)*var(--ns,1))}.bclk .ap{font-size:calc(30px*var(--s-clock,1)*var(--ts,1))}.bdate{font-size:34px;color:var(--fg2)}
.boards .cards{display:flex;gap:12px;height:170px}
.boards .card{flex:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.boards .card .n{font-size:32px;color:var(--acc)}.boards .card .a{font-size:46px;direction:ltr}.boards .card .i{font-size:24px;color:var(--fg2);direction:ltr}
.boards .card .i small{font-family:var(--ft);font-size:18px}
.L .boards .cards{height:200px}.L .boards .card .n{font-size:40px}.L .boards .card .a{font-size:58px}

/* الشاشات الكاملة */
#ov{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:70px;
  background:rgba(4,10,24,.74);color:#fff;--fg2:rgba(255,255,255,.75)}
#ov.on{display:flex}
.fsl .main,.rmsgon .main{visibility:hidden}
/* طبقة القوائم: تدور مع الشاشة حتى تكون الإعدادات والاختصارات بنفس اتجاهها */
#ui{position:fixed;left:50%;top:50%;width:100vw;height:100vh;container:ui/size;transform:translate(-50%,-50%);pointer-events:none;z-index:30}
#ui>*{pointer-events:auto}
#ui>#sc:not(.vis){pointer-events:none}
html[data-rot="180"] #ui{transform:translate(-50%,-50%) rotate(180deg)}
html[data-rot="90"] #ui,html[data-rot="270"] #ui{width:100vh;height:100vw}
html[data-rot="90"] #ui{transform:translate(-50%,-50%) rotate(90deg)}
html[data-rot="270"] #ui{transform:translate(-50%,-50%) rotate(270deg)}
.noname .mname,.noday .dayn,.nodate .hij,.nodate .gre,.nodate .bdate{visibility:hidden}
#ov:not(.black) .o-clock{display:none}
#ov:not(.black){padding-top:230px}
.o-top{position:absolute;top:40px;left:0;right:0;display:flex;direction:ltr;justify-content:center;align-items:baseline;gap:18px;color:#fff;font-family:var(--fn);text-shadow:0 3px 14px rgba(0,0,0,.6)}
.o-tt{font-size:calc(150px*var(--s-clock,1)*var(--ns,1));line-height:1;font-variant-numeric:tabular-nums}
.o-tap{font-style:normal;font-size:calc(46px*var(--s-clock,1)*var(--ts,1));color:var(--accraw);font-family:var(--ft)}
.L #ov:not(.black){padding-top:170px}.L .o-top{top:26px}.L .o-tt{font-size:calc(120px*var(--s-clock,1)*var(--ns,1))}.L .o-tap{font-size:calc(38px*var(--s-clock,1)*var(--ts,1))}
.P.arch #ov:not(.black) .o-top{top:300px}.P.arch #ov:not(.black){padding-top:480px}
.ovon .main{visibility:hidden}
/* مساحة الكاميرا الأمامية وشريط الحالة في الجوال: الخلفية تملأ الشاشة، والمحتوى ينزل تحتها */
.main{top:var(--it,0px);right:var(--ir,0px);bottom:var(--ib,0px);left:var(--il,0px)}
#ov:not(.black){border:0 solid transparent;border-width:var(--it,0px) var(--ir,0px) var(--ib,0px) var(--il,0px)}
#menu{margin-top:var(--it,0px);margin-left:var(--il,0px)}
.splash{padding:var(--it,0px) var(--ir,0px) var(--ib,0px) var(--il,0px)}
.licbadge{margin-bottom:var(--ib,0px)}
.P.arch{background-position:center var(--it,0px)} /* القوس ينزل مع المحتوى تحت الكاميرا، والشريط العلوي بلون الخلفية */
#ov.black{background:#000}
#ov.black .o-clock{color:rgba(255,255,255,var(--blk,.2));font-size:150px}
#ov.black .o-date,#ov.black .o-sub{color:rgba(255,255,255,calc(var(--blk,.2) - .04))}
.o-big{font-size:220px;line-height:1.1}
.o-big.md{font-size:120px;color:var(--accraw)}
.o-sub{font-size:62px;color:var(--accraw)}
.o-sub.sm{font-size:40px;color:var(--fg2)}
.o-ann{font-size:96px;line-height:1.55;color:var(--fg);max-width:100%;overflow-wrap:break-word;text-shadow:0 4px 18px rgba(0,0,0,.5)}
.o-ann b{display:block;font-size:190px;line-height:1.25;color:var(--accraw);margin:10px 0}
.o-ann b.mq{display:inline;font-size:1em;margin:0;color:var(--accraw)}
.L .o-ann{font-size:78px}.L .o-ann b{font-size:170px;margin:0}.L .o-ann b.mq{font-size:1em}
.o-clock{font-size:130px;direction:ltr;line-height:1}
.o-clock.sm{font-size:56px;color:var(--fg2)}
#ov.black .o-clock.sleepclk{font-size:90px;color:rgba(255,255,255,.12)}
/* رسالة شاشة السكون: خافتة وتتحرك ببطء لحماية الشاشة من ثبات الصورة */
.o-sleepmsg{font-size:40px;line-height:1.7;max-width:86%;color:rgba(255,255,255,.32);white-space:normal;animation:sdrift 240s ease-in-out infinite alternate}
.L .o-sleepmsg{font-size:34px}
@keyframes sdrift{0%{transform:translate(0,-18vh)}25%{transform:translate(4vw,6vh)}50%{transform:translate(-4vw,18vh)}75%{transform:translate(3vw,-8vh)}100%{transform:translate(-3vw,10vh)}}
@media (prefers-reduced-motion:reduce){.o-sleepmsg{animation:none}}
.o-date{font-size:40px;color:var(--fg2)}
.o-title{font-size:64px;color:var(--accraw)}
.o-zk{font-family:var(--fz);font-weight:400;line-height:1.85;white-space:pre-line;max-width:94%;text-wrap:balance}
.o-page{font-size:28px;color:var(--fg2);direction:ltr}
.o-np{width:180px;height:180px;object-fit:contain}
.o-msg{font-size:50px;display:flex;align-items:center;gap:20px;color:#ffd9a0}
.o-msg img{width:90px;height:90px}
.o-hadith{font-family:var(--fz);font-weight:400;font-size:52px;line-height:1.8;max-width:88%;color:#fff}
.o-cnt{direction:ltr;font-size:150px;line-height:1}
.o-cnt.big{font-size:230px}
.ring{position:relative;width:640px;height:640px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:9}
.ring .r0{stroke:rgba(255,255,255,.12)}
.ring .r1{stroke:var(--accraw);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s;filter:drop-shadow(0 0 6px rgba(0,0,0,.35))}
.ring .r1.red{stroke:#ff5a5a}
.ring .rt line{stroke:rgba(255,255,255,.28);stroke-width:1.2;stroke-linecap:round}
.ring .rdot{transform-origin:100px 100px;transition:transform 1s linear}
.ring .rdot circle{fill:#fff;stroke:var(--accraw);stroke-width:3;filter:drop-shadow(0 0 6px var(--accraw))}
.ring .rdot.red circle{stroke:#ff5a5a;filter:drop-shadow(0 0 6px #ff5a5a)}
.rin{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.o-lbl{font-size:40px;color:var(--fg2)}
.o-at{font-size:38px;color:var(--accraw);direction:rtl}
.ring .o-cnt{font-size:170px;line-height:1}
.o-ver{position:absolute;bottom:24px;left:0;right:0;font-size:20px;color:rgba(255,255,255,.35);font-weight:400;font-family:"Cairo",sans-serif;text-shadow:none}
.L #ov{padding:50px 120px;gap:20px}
/* أوقات الصلوات أسفل عداد الإقامة */
.o-wt{display:flex;justify-content:center;gap:14px;width:100%;max-width:1500px;flex-wrap:nowrap}
.o-wt .wti{flex:1 1 0;min-width:0;padding:14px 8px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center}
.o-wt .wti b{font-size:38px;font-weight:700;color:var(--fg2);white-space:nowrap}
.o-wt .wti span{font-family:var(--fn);font-size:56px;line-height:1.15;direction:ltr;color:#fff}
.o-wt .wti.on{background:var(--accraw);border-color:var(--accraw)}.o-wt .wti.on b,.o-wt .wti.on span{color:#1a0b05}
#ov.wt{gap:20px}
#ov.wt .ring{width:560px;height:560px}
.L #ov.wt .ring{width:380px;height:380px}.L #ov.wt .ring .o-cnt{font-size:112px}.L #ov.wt .o-lbl{font-size:28px}.L #ov.wt .o-at{font-size:26px}
.L #ov.wt{gap:10px;padding-bottom:30px}.L .o-wt .wti{padding:8px 6px}.L .o-wt .wti b{font-size:30px}.L .o-wt .wti span{font-size:44px}.L #ov.wt .o-hadith{font-size:34px;line-height:1.5}.L #ov.wt .o-msg{font-size:38px}.L #ov.wt .o-msg img{width:60px;height:60px}
.nofg .o-wt .wti+.wti{-webkit-margin-start:14px;margin-inline-start:14px}
.L .o-big{font-size:200px}.L .ring{width:480px;height:480px}.L #ov.iq{gap:12px}.L .o-hadith{font-size:44px}.L .ring .o-cnt{font-size:140px}.L .o-lbl{font-size:32px}.L .o-at{font-size:30px}

/* ===== الاختصارات ===== */
#sc{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-wrap:nowrap;gap:4px;padding:5px;border-radius:14px;background:rgba(6,12,26,.82);border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:calc(100% - 24px);direction:rtl;opacity:0;pointer-events:none;transition:opacity .3s}
#sc.vis{opacity:1;pointer-events:auto}
#sc button,#sndbtn{font:700 14px/1.4 "Cairo",Tahoma,sans-serif;color:#fff;background:transparent;border:0;border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#sc button:hover{background:#1F5A8A;outline:none}#sc button:focus-visible{background:#1F5A8A;outline:none}

/* ===== لوحة الإعدادات ===== */
#set{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;background:var(--sbg);color:var(--stext);font:400 16px/1.6 "Cairo",Tahoma,sans-serif;display:flex;flex-direction:column;direction:rtl}
.setopen #sc{display:none}
.scalways #sc{background:rgba(6,12,26,.55)}.scalways #sc button{font-size:13px;padding:5px 10px}
@media (max-width:520px){#sc button{font-size:12.5px;padding:6px 8px}}
.scalways #menu{display:none}
.sbar{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--sat,0px)) max(16px,env(safe-area-inset-right,0px),var(--sar,0px)) 12px max(16px,env(safe-area-inset-left,0px),var(--sal,0px));border-bottom:1px solid var(--sline);flex-wrap:wrap}
.sbar img{width:40px;height:40px}
.sbar .savebtn{background:#1a7f45;border-color:#1a7f45;color:#fff}.sbar .savebtn.ok{background:#2fa463}.sbar .savebtn:disabled{opacity:.7}
.sbar b{font-size:20px}.sbar small{color:var(--smuted);flex:1;min-width:0}
#setwrap{flex:1;display:flex;min-height:0;position:relative}
/* قائمة الأقسام: تُفتح بزر الخطوط الثلاث */
.snav{position:absolute;top:0;bottom:0;inset-inline-start:0;z-index:5;width:min(300px,86%);overflow-y:auto;padding:12px;background:var(--sbg);border-inline-end:1px solid var(--sline);display:flex;flex-direction:column;gap:4px;
  box-shadow:0 0 40px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .25s ease;visibility:hidden}
#set.navopen .snav{transform:none;visibility:visible}
.navshade{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;background:rgba(0,0,0,.45);display:none}
#set.navopen .navshade{display:block}
.hamb{width:46px;height:42px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:var(--scard);border:1px solid var(--sline);border-radius:10px;cursor:pointer}
.hamb span{display:block;width:22px;height:3px;margin:0 auto;border-radius:2px;background:var(--stext);flex:none}.hamb span+span{margin-top:5px}
.hamb:focus-visible{outline:2px solid var(--sacc);outline-offset:2px}
.curs{font-size:16px;font-weight:700;color:var(--sacc)}
/* إخفاء أشرطة السحب مع بقاء السحب بعجلة الفأرة واللمس */
#set *,#set{scrollbar-width:none;-ms-overflow-style:none}
#set ::-webkit-scrollbar,#set::-webkit-scrollbar{display:none;width:0;height:0}
.snav button{font:inherit;font-weight:700;text-align:start;color:var(--smuted);background:none;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.snav button:hover{color:var(--stext);background:var(--scard)}
.snav button.on{color:#fff;background:var(--son)}
.sbody{flex:1;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px));min-width:0}
.sbody>*{max-width:860px}
.sbody h2{margin:0 0 16px;font-size:26px}
.sec{background:var(--scard);border:1px solid var(--sline);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.sec h3{margin:0 0 6px;font-size:18px;color:var(--sacc)}
.note{margin:0 0 10px;color:var(--smuted);font-size:14px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.sec h3+.fld,.sec .note+.fld{border-top:0}
.fld>span:first-child{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.fld small{color:var(--smuted);font-size:13px}
.fld.col{flex-direction:column;align-items:stretch}
.fld.col>span:first-child{flex:none}
#set input[type=text],#set input[type=search],#set input[type=password],#set input[type=number],#set input[type=time],#set input[type=date],#set select,#set textarea{
  font:inherit;color:var(--stext);background:#0A1426;border:1px solid var(--sline);border-radius:10px;padding:8px 12px;min-width:0;max-width:100%}
#set select{min-width:200px}
#set textarea{width:100%;resize:vertical}
#set input:focus-visible,#set select:focus-visible,#set textarea:focus-visible,#set button:focus-visible{outline:2px solid var(--sacc);outline-offset:2px}
.nb{display:flex;align-items:center;gap:6px}
.nb input{width:90px;text-align:center}
.nb{flex-wrap:wrap;justify-content:flex-end}.nb button:not(.btn){width:38px;height:38px;border-radius:10px;border:1px solid var(--sline);background:#0A1426;color:var(--stext);font:700 20px "Cairo";cursor:pointer}
.nb em{font-style:normal;color:var(--smuted);font-size:13px}
.tog{cursor:pointer}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog i{width:52px;height:30px;border-radius:15px;background:#2A3B5C;position:relative;flex:none;transition:background .2s}
.tog i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog input:checked+i{background:var(--son)}
.tog input:checked+i::after{transform:translateX(-22px)}
.tog input:focus-visible+i{outline:2px solid var(--sacc);outline-offset:2px}
.btn{font:700 15px "Cairo",Tahoma,sans-serif;color:#fff;background:var(--son);border:1px solid transparent;border-radius:10px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;border-color:var(--sline);color:var(--stext)}
.btn.danger{background:var(--sdanger)}.btn.danger.ghost{background:transparent;color:var(--sdanger);border-color:var(--sdanger)}
.btn.sm{padding:5px 10px;font-size:13px}
.row-end{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:24px}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.today div{background:#0A1426;border:1px solid var(--sline);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center}
.today b{color:var(--sacc)}.today span{font-size:22px;font-weight:700;direction:ltr}.today small{color:var(--smuted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#0A1426;border:1px solid var(--sline);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.list li>div{flex:1 1 260px;min-width:0}
.list li p{margin:0;overflow-wrap:anywhere}.list li small{color:var(--smuted);display:block}
.list li span{display:flex;gap:6px}
.list li.ed,.ed{display:block;background:#0E1A30;border-color:var(--son);border-radius:12px;padding:10px 14px;margin-top:8px}
.empty{color:var(--smuted);justify-content:center!important}
.days{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.days label{background:#0A1426;border:1px solid var(--sline);border-radius:8px;padding:4px 10px;display:flex;gap:6px;align-items:center}
.thumbs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumbs li{background:#0A1426;border:1px solid var(--sline);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px}
.thumbs img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#000}
.thumbs span{display:flex;gap:6px;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--sline);border-radius:10px;overflow:hidden;margin-bottom:12px}

.bgs{display:flex;flex-wrap:wrap;gap:8px;max-height:420px;overflow-y:auto;padding:4px}
.bgt{border:3px solid transparent;border-radius:10px;cursor:pointer;padding:0;background-repeat:no-repeat;flex:none}
.bgt.P{width:96px;height:166px;background-image:url(bg/thumbs-p2.jpg);background-size:90px auto;border-width:3px}
.bgt.L{width:166px;height:96px;background-image:url(bg/thumbs-l2.jpg);background-size:160px auto}
.bgt.on{border-color:var(--sacc)}
.sw{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--son)}
.fprev{font-size:28px;text-align:center;padding:12px;background:#0A1426;border-radius:12px;margin-top:8px;color:var(--sacc)}
.bprev{background:#0A1426;border-radius:12px;padding:16px;text-align:center;margin:10px 0}
.bprev b{display:block;color:var(--tc);font-size:28px}.bprev p{color:var(--bc);margin:6px 0 0;white-space:pre-line}
.tw{overflow-x:auto;margin-top:10px}
.cal{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px}.cal thead th:first-child{width:24%}

.cal .calbtn{display:block;margin-top:4px}.cal .calbtn .btn{padding:2px 10px;font-size:12px}.cal tr.editing{outline:2px solid var(--sacc);outline-offset:-2px}
.calbox{background:var(--scard);border:1px solid var(--sacc);border-radius:12px;padding:12px;margin-top:10px}.calbox>b{color:var(--sacc)}
.calgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.calgrid label{display:flex;flex-direction:column;font-size:13px;color:var(--smuted)}.calgrid input{width:100%}

.about{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.about img{width:90px;height:90px}.about .qr{width:110px;height:110px;background:#fff;border-radius:8px;padding:4px}

.tbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tcount{margin-inline-start:auto;color:var(--smuted);font-size:13px}

.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sitem{display:flex;gap:14px;align-items:center;background:#0A1426;border:1px solid var(--sline);border-radius:12px;padding:10px;flex-wrap:wrap}

.sitem>span{display:flex;gap:6px;flex-wrap:wrap}

.seg.m0{margin:0}

.bgs.pick{max-height:360px;margin:6px 0 4px}
.rg{display:flex;align-items:center;gap:10px}.rg input{width:180px;accent-color:var(--son)}.rg output{min-width:56px;color:var(--smuted);font-size:13px;direction:ltr;text-align:center}

.code small,.code span{color:var(--smuted);font-size:13px}
/* لوحة مفاتيح التطبيق */
.vkwrap{direction:ltr;position:relative}
.vkwrap.dock{position:absolute;left:0;right:0;bottom:0;z-index:45;background:#0a1222;border-top:1px solid var(--sline);box-shadow:0 -10px 30px rgba(0,0,0,.45);padding:10px max(10px,var(--sal,0px)) calc(10px + var(--sab,0px)) max(10px,var(--sar,0px))}
.vkb{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:7px;direction:ltr}
.vkr{display:flex;gap:6px}
.vk{flex:1;min-width:0;height:48px;font:700 21px/1 "Cairo",Tahoma,sans-serif;color:var(--stext);background:var(--scard);border:1px solid var(--sline);border-radius:10px;cursor:pointer;padding:0 2px;touch-action:manipulation}
.vk:hover{background:#1b2d4f}.vk:active{transform:translateY(1px)}
.vk:focus{outline:3px solid var(--sacc);outline-offset:1px}
.vk.fn{font-size:15px;color:var(--smuted);background:#0f1b33}
.vk.fn.on{color:#0b1528;background:var(--sacc)}
.vk.sp{font-size:15px;color:var(--smuted)}
.vk.ok{font-size:16px;background:#1a7f45;border-color:#1a7f45;color:#fff}
.vk{position:relative}.vk sup{position:absolute;top:3px;left:6px;font-size:11px;color:var(--smuted);font-weight:400}
.vkr.num .vk{height:40px;font-size:18px}
.vk.ent{background:#1F5A8A;color:#fff;font-size:22px}
.vkbar{justify-content:space-between;align-items:center}.vk.hide{flex:none;width:auto;padding:0 16px;height:34px;font-size:14px}.vkhint{font-size:12px;color:var(--smuted);direction:rtl}
.vkalt{position:absolute;z-index:3;display:flex;gap:4px;padding:6px;background:#22365A;border:1px solid var(--sacc);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.vkalt .vk{flex:none;width:48px}
.edbox .vkwrap{margin-top:2px}
@container ui (max-width:600px){ .vk{height:40px;font-size:17px}.vk.fn,.vk.sp,.vk.ok{font-size:12px}.vkr{gap:4px}.vkb{gap:4px} }
#ed{position:absolute;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#ed[hidden]{display:none!important}
.edbox{width:min(1100px,100%);height:100%;max-height:100%;overflow:hidden;background:var(--sbg);border:1px solid var(--sline);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.edh{display:flex;align-items:center;gap:10px}.edh b{font-size:18px;color:var(--sacc);flex:1;min-width:0}
.edc{color:var(--smuted);font-size:13px}
.edtools{display:flex;flex-wrap:wrap;gap:8px}
.edg{display:flex;flex-wrap:wrap;gap:4px;background:var(--scard);border:1px solid var(--sline);border-radius:10px;padding:4px}
.edg button,.edfile{font:700 18px "Amiri","Cairo",serif;color:var(--stext);background:none;border:0;border-radius:7px;padding:4px 10px;cursor:pointer;min-width:36px}
.edg button:hover,.edfile:hover{background:var(--son);color:#fff}
.edg.har button{font-size:22px}
.edfile{font:700 13px "Cairo",sans-serif;display:inline-flex;align-items:center}
.edg button[data-ed]{font:700 13px "Cairo",sans-serif}
#edt{width:100%;font-size:28px!important;line-height:1.9!important;padding:12px 14px!important;resize:none;min-height:64px;flex:1 1 auto}
/* المحرر يملأ الشاشة ويتكيف مع الاتجاه: عمودي = النص فوق ولوحة المفاتيح تحته، أفقي قصير = النص بجانب لوحة المفاتيح */
.edbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.edmain{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.edside{flex:none;display:flex;flex-direction:column;justify-content:flex-end}.edside:empty{display:none}
.edpv{flex:none}#edp{max-height:30vh;overflow-y:auto}
@container ui (orientation:landscape) and (max-height:860px){
  .edbody{flex-direction:row}.edmain{flex:1 1 48%}.edside{flex:1 1 52%;min-width:0}
  .edtools .edg button{padding:2px 7px;font-size:16px}.edg.har button{font-size:19px}
  #edt{font-size:22px!important;line-height:1.7!important}#edp{font-size:22px;line-height:1.6}
  .edside .vk{height:clamp(28px,calc((100cqh - 210px)/6.6),46px);font-size:clamp(14px,calc((100cqh - 210px)/14),20px)}
  .edside .vkr{gap:4px}.edside .vkb{gap:4px}.edside .vkhint{display:none}
  .vkwrap.dock .vk{height:clamp(28px,calc((100cqh - 120px)/10),44px)}
}
@container ui (orientation:landscape) and (max-height:520px){ .edpv,.edtools .edg.har{display:none}.edh b{font-size:15px}.edbox{padding:8px 10px;gap:6px}.edf small{display:none} }
@container ui (orientation:portrait){ .edbox{max-width:100%} }
.edpv{background:var(--scard);border:1px solid var(--sline);border-radius:12px;padding:12px 16px;text-align:center}
.edpv small{display:block;color:var(--smuted);font-size:12px;text-align:start}
#edp{color:var(--sacc);font-size:30px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere}
.edf{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}.edf small{flex:1;color:var(--smuted)}
.rots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.rots.o3{grid-template-columns:repeat(3,1fr)}
.rot{font:inherit;color:var(--stext);background:#0A1426;border:2px solid var(--sline);border-radius:14px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rot:hover{border-color:var(--son)}
.rot.on{border-color:var(--sacc);background:rgba(231,182,91,.1)}
.rot b{font-size:15px}.rot small{color:var(--smuted);font-size:12px}
.rscr{width:44px;height:70px;border:3px solid currentColor;border-radius:7px;display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0;transition:transform .3s}
.rscr i{position:absolute;top:5px;left:5px;right:5px;height:8px;background:var(--sacc);border-radius:2px}
.rscr em{font-style:normal;font-weight:700;font-size:22px}
.rscr.landscape{width:70px;height:44px}.rscr.auto{border-style:dashed}
@container ui (max-width:560px){.rots{grid-template-columns:repeat(2,1fr)}.rots.o3{grid-template-columns:repeat(3,1fr)}}
.lock{max-width:420px;margin:60px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--sdanger)}
#toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;background:#1F5A8A;color:#fff;font:700 15px "Cairo";padding:10px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (max-width:760px){
  .sbar small{display:none}
  .grid2{grid-template-columns:1fr}
  #set select{min-width:0;width:100%}
}
@container ui (max-width:760px){
  .sbar small{display:none}
  .grid2{grid-template-columns:1fr}
  #set select{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.tick.mq{animation:none;left:auto;right:24px}.fade{animation:none}}

#set .pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;border-radius:999px;font-weight:700;background:rgba(255,255,255,.08);color:var(--smuted)}#set .pill.ok{background:rgba(47,164,99,.18);color:#4fd18b}#set .pill.bad{background:rgba(229,99,107,.18);color:var(--sdanger)}

/* ===== تنظيم الإعدادات: مجموعات وأيقونات وصفحة رئيسية وبحث ===== */
#set .ico{width:20px;height:20px;flex:none;pointer-events:none}
.snav{gap:2px}
.snav button{display:flex;align-items:center;gap:10px;font-weight:600;padding:9px 12px}
.snav button .ico{opacity:.75}.snav button.on .ico{opacity:1}
.snav .nhome{margin-bottom:6px;border:1px solid var(--sline);background:var(--scard);color:var(--stext)}
.ngrp{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.nglbl{font-size:12.5px;font-weight:700;letter-spacing:.2px;color:var(--sacc);opacity:.85;padding:6px 12px 4px}
.shead{margin:0 0 18px}
.crumb{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;color:var(--smuted);background:none;border:0;padding:0;cursor:pointer}
.crumb .ico{width:16px;height:16px}button.crumb:hover{color:var(--stext)}
.crumb-sep{color:var(--smuted);margin:0 8px;font-size:13px}.crumb.g{cursor:default}
.shead h2,.shome h2{display:flex;align-items:center;gap:12px;margin:8px 0 4px;font-size:26px}
.shead h2 .ico,.shome h2 .ico{width:30px;height:30px;color:var(--sacc)}
.sdesc{margin:0;color:var(--smuted);font-size:15px}
.ssearch{display:flex;align-items:center;gap:10px;margin:18px 0 20px;padding:0 16px;background:var(--scard);border:1px solid var(--sline);border-radius:14px}
.ssearch:focus-within{border-color:var(--sacc)}
.ssearch .ico{color:var(--smuted)}
#set .ssearch input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--stext);padding:14px 0;box-shadow:none}
.hgrp{margin:0 0 22px}
.hgrp h3{margin:0 0 10px;font-size:14px;color:var(--sacc);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile,.sr{display:flex;align-items:flex-start;gap:12px;text-align:start;font:inherit;color:var(--stext);background:var(--scard);border:1px solid var(--sline);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.tile:hover,.tile:focus-visible,.sr:hover,.sr:focus-visible{border-color:var(--sacc);outline:0}
.tile .ti,.sr .ti{width:40px;height:40px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--sacc)}
.tile .ti .ico,.sr .ti .ico{width:22px;height:22px}
.tile .tt,.sr .tt{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b,.sr b{font-size:15.5px}.tile small,.sr small{color:var(--smuted);font-size:13px;line-height:1.5}
.sres{display:flex;flex-direction:column;gap:8px}
.sr{align-items:center;padding:10px 14px}
.snext{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--sline)}
#set .flash{animation:flash 2.4s ease}
@keyframes flash{0%,60%{background:rgba(231,182,91,.18);box-shadow:0 0 0 2px var(--sacc)}100%{background:transparent;box-shadow:none}}
/* الشاشات العريضة: قائمة الأقسام ثابتة بجانب الإعدادات */
@container ui (min-width:1100px){
  #set .snav{position:relative;transform:none;visibility:visible;box-shadow:none;width:270px;flex:none}
  #set .hamb{display:none}#set .navshade{display:none}
}
.nocq #ui.cqw #set .snav{position:relative;transform:none;visibility:visible;box-shadow:none;width:270px;flex:none}
.nocq #ui.cqw #set .hamb{display:none}.nocq #ui.cqw #set .navshade{display:none}
@container ui (max-width:560px){.tiles{grid-template-columns:1fr}.shead h2,.shome h2{font-size:22px}}
.nocq #ui.cq560 .tiles{grid-template-columns:1fr}
.nofg .snav button>*+*,.nofg .tile>*+*,.nofg .sr>*+*,.nofg .ssearch>*+*,.nofg .shead h2>*+*,.nofg .shome h2>*+*{-webkit-margin-start:10px;margin-inline-start:10px}
.nofg .tiles>*{margin-bottom:10px}

/* ===== الفترة التجريبية والتفعيل ===== */
.licbadge{position:absolute;right:24px;bottom:8px;z-index:4;font:600 18px/1.4 "Cairo",Tahoma,sans-serif;color:rgba(255,255,255,.78);background:rgba(0,0,0,.38);padding:4px 18px;border-radius:999px;white-space:nowrap;direction:rtl}
.licstrip{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;margin:0 0 16px;padding:14px 18px;border-radius:14px;border:1px solid #c99a3d;background:linear-gradient(90deg,rgba(231,182,91,.16),rgba(231,182,91,.06));color:var(--stext);text-align:start;font:inherit;cursor:pointer}
.licstrip.bad{border-color:var(--sdanger);background:rgba(229,99,107,.14)}
.licstrip b{display:block;font-size:16px}.licstrip small{display:block;color:var(--smuted);font-size:13px;margin-top:2px}
.licstrip .lsid{flex:none;text-align:center}.licstrip .lsid b{font-size:24px;letter-spacing:3px;color:var(--sacc);direction:ltr}
.P .licbadge{top:auto;bottom:50px;right:50%;transform:translateX(50%);font-size:20px}
.licnum{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;direction:ltr;margin-top:6px}.licnum button{font:700 24px "Cairo",sans-serif;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 0;cursor:pointer}.licnum button:focus{outline:3px solid #E7B65B}
.licov{position:absolute;top:0;right:0;bottom:0;left:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,.9);direction:rtl;font-family:"Cairo",Tahoma,sans-serif;color:#fff;text-align:center;padding:60px}
.licon #menu{z-index:7}
.licbox{display:flex;flex-direction:column;align-items:center;gap:26px;max-width:1100px}
.liclogo{height:300px}
.L .liclogo{height:200px}.L .licbox{gap:16px}
.lict{font-size:56px;font-weight:700;line-height:1.3}
.licm{font-size:46px;color:#e6dfcf;line-height:1.4}
.licwa{display:flex;align-items:center;gap:22px;background:#1fa855;color:#fff;text-decoration:none;border-radius:999px;padding:14px 46px;font-size:46px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.licwa b{font-size:58px;letter-spacing:2px}
.licid{font-size:34px;color:#cfd6e2;display:flex;flex-direction:column;gap:4px}.licid b{font-size:44px;color:#fff;letter-spacing:3px}.licid small{font-size:24px;color:#9aa6b6}
.licf{display:flex;gap:14px}
.licf input{width:340px;font:700 38px "Cairo",Tahoma,sans-serif;text-align:center;letter-spacing:4px;padding:10px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;direction:ltr}
.licf button{font:700 36px "Cairo",Tahoma,sans-serif;padding:10px 34px;border-radius:16px;border:0;background:#c9a24a;color:#1a1206;cursor:pointer}
.licerr{font-size:30px;color:#ff8a8a}
.nofg .licbox>*+*{margin-top:24px}.nofg .licwa>*+*,.nofg .licf>*+*{-webkit-margin-start:16px;margin-inline-start:16px}

/* صباحاً/مساءً على يسار الوقت مع الأرقام العربية، وAM/PM على يمينه مع الإنجليزية */
.clk .apl{display:none}
.apar .clk .apl{display:block}
.apar .clk .sx .ap{display:none}
.apar .clk>.ap:not(.apl){order:-1}
.apar .o-tap{order:-1}
.ap.apl{align-self:flex-end;margin-bottom:.35em}
.clk .tm{white-space:nowrap}.clk>*{flex:none}
.P.apar .cpan .clk{gap:14px}
/* نافذة تفعيل الشاشة بكود */
#act.actov{position:absolute;top:0;right:0;bottom:0;left:0;z-index:45;pointer-events:auto;background:rgba(5,10,22,.86);display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl;font:400 16px/1.6 "Cairo",Tahoma,sans-serif;color:var(--stext);overflow-y:auto}
.actbox{width:420px;max-width:100%;background:var(--sbg);border:1px solid var(--sline);border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.actbox>*+*{margin-top:12px}
.actbox img{width:64px;height:64px;object-fit:contain}.actbox h2{margin:4px 0 0;font-size:26px;color:var(--sacc)}.actbox p{margin:6px 0 0;color:var(--smuted);font-size:14.5px}
.actsite{direction:ltr;font-weight:700;color:var(--stext)!important;background:var(--scard);border-radius:8px;padding:4px 12px}
.actdev b{font-size:1.25em;letter-spacing:2px;color:var(--sacc)}
.actf{width:100%;display:flex;flex-direction:column;text-align:right;font-size:14px;color:var(--smuted)}
.actf input,.actcode{width:100%;font:inherit;color:var(--stext);background:#060d1c;border:2px solid var(--sline);border-radius:12px;padding:10px 12px}
.actcode{font:700 40px/1.2 Consolas,"Courier New",monospace;text-align:center;letter-spacing:.14em;color:var(--sacc)}
.actf input:focus,.actcode:focus{outline:none;border-color:var(--sacc)}
.actpad{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.licpad{max-width:340px;margin:6px auto 14px;display:flex;flex-direction:column;gap:10px}.licpad input{width:100%;font:700 30px/1.2 Consolas,"Courier New",monospace;text-align:center;letter-spacing:.12em;color:var(--sacc);background:#060d1c;border:2px solid var(--sline);border-radius:12px;padding:8px}
.actpad button{font:700 24px "Cairo",sans-serif;color:var(--stext);background:var(--scard);border:1px solid var(--sline);border-radius:12px;padding:10px 0;cursor:pointer}
.actpad button.ok{background:#1a7f45;border-color:#1a7f45;color:#fff;font-size:19px}
.actpad button:focus{outline:3px solid var(--sacc);outline-offset:1px}
.acterr{min-height:1.6em;font-weight:700}.acterr.bad{color:var(--sdanger)!important}.acterr.ok{color:#4fd18b!important}
.actlater{font:inherit;background:none;border:0;color:var(--smuted);text-decoration:underline;cursor:pointer}
.nogrid .actpad{display:block}.nogrid .actpad button{width:31%;margin:1%}
#set .sched{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}#set .sched label{display:flex;flex-direction:column;font-size:13px;color:var(--smuted)}#set .sched input{font:inherit;color:var(--stext);background:#060d1c;border:1px solid var(--sline);border-radius:8px;padding:6px 8px}
.nogrid #set .sched{display:block}
.fshint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:35;background:rgba(6,12,26,.82);color:#fff;font:700 16px "Cairo",Tahoma,sans-serif;padding:10px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.18);pointer-events:none;transition:opacity 1s;direction:rtl;white-space:nowrap}.fshint.out{opacity:0}
.preview #menu,.preview #sc{display:none!important}
.pvbar{position:fixed;top:8px;right:8px;z-index:60;background:#1F5A8A;color:#fff;font:700 13px "Cairo",Tahoma,sans-serif;padding:5px 12px;border-radius:999px;direction:rtl;pointer-events:none;opacity:.92}.pvbar.bad{background:#b32d2e}
/* دقة الشاشات الكبيرة: لوحة الإعدادات والأزرار تكبر مع الشاشة (تلفاز 4K) فتبقى مقروءة وواضحة */
#set,#sc,#toast,#act,.fshint{zoom:var(--uiz,1)}
.bglay{position:absolute;top:0;right:0;bottom:0;left:0;background:center/cover no-repeat;opacity:0;transition:opacity .6s ease;pointer-events:none}.bglay.in{opacity:1}
.bgt.svg{background-size:cover!important;background-position:center!important;position:relative}.bgt.svg::after{content:"جديد";position:absolute;top:4px;left:4px;font:700 10px "Cairo",sans-serif;color:#1b1406;background:#E7B65B;border-radius:6px;padding:0 5px;line-height:16px}
.bgw{position:relative;display:inline-block;flex:none}.bgx{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--sdanger);color:#fff;font:700 18px/1 "Cairo",sans-serif;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}.bgx.re{background:#1a7f45;font-size:16px}
.bgdel .bgt{opacity:.85}
/* رسالة بداية التشغيل */
.splash{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:inherit;background-size:cover;transition:opacity 1s ease}
.splash::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.25) 0,rgba(0,0,0,.6) 75%)}
.splash.out{opacity:0;pointer-events:none}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;padding:60px}
.sp-in>*{opacity:0;animation:spIn 1s ease forwards}
.sp-bs{font-family:var(--fz);font-weight:700;color:var(--acc);line-height:1.6;text-shadow:0 4px 18px rgba(0,0,0,.55)}
.sp-lg{animation-delay:.5s;display:flex;align-items:center;justify-content:center}
