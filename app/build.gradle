plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghazwani.mymeds'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghazwani.mymeds'
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { v ->
        v.outputs.all { o -> outputFileName = "MyMeds-${v.versionName}.apk" }
    }
}
